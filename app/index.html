<script>
  (function () {
    try {
      var t = localStorage.getItem('rohapp.theme') || 'light';
      var allowed = ['light','dark','system','ocean','ocean-dark','burgundy','burgundy-dark','purple','purple-dark','teal','teal-dark','amber','amber-dark','royal-gold-dark','cyberpunk-dark'];
      if (allowed.indexOf(t) === -1) t = 'light';
      var mode = t === 'system' ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light') : (/dark$/.test(t) ? 'dark' : (t === 'dark' ? 'dark' : 'light'));
      var accent = String(t).replace(/-dark$/, '');
      if (accent !== 'ocean' && accent !== 'burgundy' && accent !== 'purple' && accent !== 'amber' && accent !== 'teal' && accent !== 'royal-gold' && accent !== 'cyberpunk') accent = 'emerald';
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.setAttribute('data-accent', accent);
      var mc = { 'emerald:light':'#064e3b','emerald:dark':'#0a1f18','ocean:light':'#1d6fa5','ocean:dark':'#07192b','burgundy:light':'#7f1d1d','burgundy:dark':'#22080d','purple:light':'#6d28d9','purple:dark':'#150a2a','amber:dark':'#1a1208','teal:light':'#0d9488','teal:dark':'#021a19','amber:light':'#d97706','amber:dark':'#1c0a00','royal-gold:dark':'#0c0902','cyberpunk:dark':'#070514' }[accent + ':' + mode];
      var mt = document.querySelector('meta[name="theme-color"]');
      if (mt && mc) mt.setAttribute('content', mc);
      var fontScale = localStorage.getItem('rohapp.fontScale');
      if (fontScale) document.documentElement.style.setProperty('--font-scale', fontScale);
    } catch (e) {}
  })();
</script>
